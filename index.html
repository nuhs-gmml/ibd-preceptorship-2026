<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NUHS IBD Preceptorship 2026 — Pre-Workshop Learning</title>
<style>
  :root{
    --navy:#0b3d66; --blue:#1565a6; --blue-light:#4a9fdb; --orange:#e8792f;
    --green:#1c8a4c; --grey-bg:#f4f6f8; --grey-border:#dde3ea; --grey-text:#5b6b7a;
    --amber:#d98c00; --red:#c0392b; --card-radius:10px;
    --ferring-blue:#003057;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Roboto,Arial,sans-serif;background:var(--grey-bg);color:#1c2733;}
  a{color:inherit;}

  /* ===== Top identity bar ===== */
  .brand-strip{height:8px;background:linear-gradient(90deg,var(--orange),var(--red) 20%,var(--navy) 55%,var(--blue) 100%);}
  header.site-header{
    background:#fff;border-bottom:1px solid var(--grey-border);
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 28px;gap:20px;flex-wrap:wrap;
  }
  .site-title h1{margin:0;font-size:19px;color:var(--navy);letter-spacing:.2px;}
  .site-title p{margin:2px 0 0;font-size:12.5px;color:var(--grey-text);}
  .logo-row{display:flex;align-items:center;gap:14px;}
  .logo-img{height:42px;max-width:220px;object-fit:contain;}

  /* ===== App shell ===== */
  .app-shell{display:flex;min-height:calc(100vh - 70px);}

  /* ===== Sidebar: master progress ===== */
  nav.master-progress{
    width:280px;flex:0 0 280px;background:#fff;border-right:1px solid var(--grey-border);
    padding:18px 0 40px;overflow-y:auto;
  }
  .mp-heading{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--grey-text);
    text-transform:uppercase;padding:0 18px 10px;}
  .mp-item{position:relative;padding:10px 18px 10px 46px;cursor:pointer;font-size:13.5px;border-left:3px solid transparent;}
  .mp-item:hover{background:#f7f9fb;}
  .mp-item.active{background:#eaf3fb;border-left-color:var(--blue);font-weight:600;}
  .mp-item.locked{cursor:not-allowed;color:#a7b1bc;}
  .mp-icon{position:absolute;left:16px;top:9px;width:20px;height:20px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;background:#c3cbd3;}
  .mp-icon.done{background:var(--green);}
  .mp-icon.active-icon{background:var(--blue);}
  .mp-icon.retake{background:var(--amber);}
  .mp-icon.locked-icon{background:#c3cbd3;}
  .mp-sub{padding-left:14px;font-size:12px;color:var(--grey-text);margin-top:2px;}
  .mp-sub.pass{color:var(--green);font-weight:600;}
  .mp-sub.fail{color:var(--amber);font-weight:600;}
  .mp-divider{margin:10px 18px;border-top:1px solid var(--grey-border);}
  .mp-compulsory-tag{display:inline-block;margin-top:3px;font-size:10px;font-weight:700;color:#fff;
    background:var(--orange);padding:1px 6px;border-radius:3px;letter-spacing:.03em;}

  /* ===== Main content ===== */
  main.stage-main{flex:1;padding:26px 32px 60px;max-width:980px;}
  .stage-header{margin-bottom:14px;}
  .stage-header h2{margin:0 0 4px;font-size:22px;color:var(--navy);}
  .stage-header p{margin:0;color:var(--grey-text);font-size:14px;}
  .tag-row{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;}
  .tag{background:#eef2f6;color:var(--grey-text);font-size:11px;padding:3px 9px;border-radius:12px;}

  /* ===== Video player card ===== */
  .player-card{background:#0d1620;border-radius:var(--card-radius);overflow:hidden;
    border:2px solid var(--navy);position:relative;}
  .player-frame-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;}
  #yt-player{width:100%;height:100%;}
  .sim-player{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#cfe0ee;}
  .sim-player .badge{background:var(--orange);color:#fff;font-size:11px;padding:3px 10px;border-radius:10px;margin-bottom:10px;letter-spacing:.03em;}
  .sim-player h3{margin:0 0 6px;font-size:17px;}
  .sim-player p{margin:0 0 16px;font-size:12.5px;color:#93a7ba;max-width:420px;text-align:center;}
  .sim-controls{display:flex;gap:10px;}
  .sim-btn{background:var(--blue);color:#fff;border:none;padding:9px 18px;border-radius:6px;cursor:pointer;font-size:13px;}
  .sim-btn:hover{background:var(--blue-light);}
  .sim-time{margin-top:14px;font-size:12px;color:#7c93a8;font-variant-numeric:tabular-nums;}

  /* segmented progress bar */
  .segbar{display:flex;gap:4px;padding:10px 12px;background:#0d1620;border-top:1px solid #1c2a38;}
  .segbar .seg{flex:1;height:9px;border-radius:5px;background:#2a3947;cursor:pointer;position:relative;}
  .segbar .seg.active{background:var(--blue-light);}
  .segbar .seg.done{background:var(--green);}
  .segbar .seg.locked{cursor:not-allowed;}
  .seglabels{display:flex;gap:4px;padding:0 12px 10px;background:#0d1620;}
  .seglabels .lbl{flex:1;font-size:9.5px;color:#8ea3b8;text-align:center;line-height:1.2;padding:0 2px;}
  .seglabels .lbl.current{color:#fff;font-weight:700;}

  /* in-video overlay prompt, docked in the SAME player window */
  .prompt-overlay{position:absolute;inset:0;background:rgba(6,14,22,.86);display:none;
    align-items:center;justify-content:center;padding:18px;z-index:5;}
  .prompt-overlay.show{display:flex;}
  .prompt-card{background:#fff;border-radius:10px;max-width:560px;width:100%;padding:20px 22px;
    max-height:92%;overflow:auto;}
  .prompt-kind{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:10px;
    color:#fff;margin-bottom:8px;letter-spacing:.03em;}
  .prompt-kind.poll{background:var(--blue);}
  .prompt-kind.check{background:var(--orange);}
  .prompt-card h4{margin:0 0 12px;font-size:14.5px;line-height:1.4;color:#1c2733;}
  .prompt-opt{display:flex;align-items:flex-start;gap:9px;padding:8px 10px;border:1px solid var(--grey-border);
    border-radius:7px;margin-bottom:7px;cursor:pointer;font-size:13px;}
  .prompt-opt:hover{background:#f7f9fb;}
  .prompt-opt.selected{border-color:var(--blue);background:#eaf3fb;}
  .prompt-opt.correct{border-color:var(--green);background:#e9f7ef;}
  .prompt-opt.incorrect{border-color:var(--red);background:#fdecea;}
  .prompt-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;}
  .btn{background:var(--blue);color:#fff;border:none;padding:9px 20px;border-radius:6px;cursor:pointer;font-size:13.5px;font-weight:600;}
  .btn:hover{background:var(--blue-light);}
  .btn:disabled{background:#b7c4d0;cursor:not-allowed;}
  .btn.secondary{background:#eef2f6;color:#33414d;}
  .btn.secondary:hover{background:#e1e8ee;}
  .rationale-box{margin-top:10px;font-size:12.5px;background:#f4f6f8;border-radius:6px;padding:9px 11px;color:#3d4a56;}

  .stage-footer{display:flex;justify-content:space-between;align-items:center;margin-top:18px;}
  .video-progress-text{font-size:12.5px;color:var(--grey-text);}

  /* ===== Quiz ===== */
  .quiz-card{background:#fff;border:1px solid var(--grey-border);border-radius:var(--card-radius);padding:22px 26px;}
  .quiz-meta{font-size:13px;color:var(--grey-text);margin-bottom:16px;}
  .qblock{border-bottom:1px solid var(--grey-border);padding:16px 0;}
  .qblock:last-child{border-bottom:none;}
  .qblock h5{margin:0 0 10px;font-size:14px;color:#1c2733;}
  .qopt{display:flex;gap:9px;align-items:flex-start;padding:7px 9px;border-radius:6px;cursor:pointer;font-size:13px;}
  .qopt:hover{background:#f7f9fb;}
  .quiz-result{margin-top:16px;padding:16px 18px;border-radius:8px;font-size:14px;}
  .quiz-result.pass{background:#e9f7ef;border:1px solid #b6e3c6;color:var(--green);}
  .quiz-result.fail{background:#fdf3e6;border:1px solid #f1cf9c;color:var(--amber);}

  /* ===== Feedback ===== */
  .fb-q{margin-bottom:18px;}
  .fb-q label{display:block;font-size:13.5px;font-weight:600;margin-bottom:8px;}
  .likert{display:flex;gap:8px;}
  .likert span{flex:1;text-align:center;border:1px solid var(--grey-border);border-radius:6px;padding:8px 4px;
    cursor:pointer;font-size:12.5px;}
  .likert span.selected{background:var(--blue);color:#fff;border-color:var(--blue);}
  textarea{width:100%;min-height:80px;border:1px solid var(--grey-border);border-radius:6px;padding:10px;font-size:13px;font-family:inherit;}

  .completion-banner{background:linear-gradient(90deg,var(--navy),var(--blue));color:#fff;border-radius:10px;
    padding:28px 30px;text-align:center;}
  .completion-banner h2{margin:0 0 8px;font-size:22px;}
  .completion-banner p{margin:0;opacity:.9;font-size:13.5px;}

  .gate-screen{max-width:420px;margin:60px auto;background:#fff;border:1px solid var(--grey-border);
    border-radius:10px;padding:28px 30px;}
  .gate-screen h2{margin-top:0;font-size:18px;color:var(--navy);}
  .gate-screen input{width:100%;padding:9px 11px;border:1px solid var(--grey-border);border-radius:6px;
    margin-bottom:12px;font-size:13.5px;}
  .gate-screen label{font-size:12.5px;color:var(--grey-text);display:block;margin-bottom:4px;}

  .locked-note{font-size:12.5px;color:var(--grey-text);margin-top:14px;background:#f4f6f8;padding:10px 12px;border-radius:6px;}
  @media(max-width:860px){
    .app-shell{flex-direction:column;}
    nav.master-progress{width:100%;flex:none;border-right:none;border-bottom:1px solid var(--grey-border);}
  }
</style>
</head>

: 179, "prompt": {"kind": "poll", "question": "What is the likely diagnosis?", "options": ["Erythema nodosum", "Pyoderma gangrenosum", "Erythema multiforme", "Herpes zoster", "Folliculitis"], "multi": false}}, {"label": "Case Discussion", "startSec": 179, "endSec": 215, "prompt": {"kind": "poll", "question": "What should be done?", "options": ["Discontinue JAK inhibitor until the shingles resolve; no antiviral required", "Continue JAK inhibitor and start antiviral therapy for shingles", "Stop the JAK inhibitor until the shingles crust over, and start antiviral therapy"], "multi": false}}, {"label": "Evidence Practice", "startSec": 216, "endSec": 622, "prompt": null}, {"label": "Back to the Case", "startSec": 623, "endSec": 708, "prompt": {"kind": "poll", "question": "When should colonoscopy surveillance for colorectal cancer begin?", "options": ["Now, at the time of PSC diagnosis, with annual surveillance thereafter", "Wait until 8 years after the original IBD diagnosis", "Only if the patient becomes symptomatic", "Surveillance is not needed since the patient is already on advanced therapy"], "multi": false}}, {"label": "Back to the Case", "startSec": 708, "endSec": 1117, "prompt": null}, {"label": "Take Home", "startSec": 1118, "endSec": null, "prompt": null}], "quizKey": "M6"}, {"id": "closing", "kind": "closing", "title": "Closing", "subtitle": "Course recap and key takeaways.", "tags": ["Conclusion"], "duration": 260, "vimeoId": "1220387586", "videoUrl": "", "gcsObject": "gs://nuhs-ibd-preceptorship-2026/lecture videos/NUHS_IBD_Preceptorship_2026_Closing_v3.mp4", "segments": [{"label": "Congratulations", "startSec": 0, "endSec": 47, "prompt": null}, {"label": "Module Recap", "startSec": 48, "endSec": 108, "prompt": null}, {"label": "Skill Gains", "startSec": 109, "endSec": 187, "prompt": null}, {"label": "Feedback", "startSec": 187, "endSec": 228, "prompt": null}, {"label": "Thank You", "startSec": 229, "endSec": null, "prompt": null}], "quizKey": null}]</script <script id="quiz-data" type="application/json">{"M1": {"title": "M1 · The Diagnostic Toolkit", "questions": [{"num": 1, "question": "A 29-year-old with mild intermittent abdominal discomfort and no red-flag symptoms is being assessed for possible IBD. Her faecal calprotectin returns at 35 µg/g. What is the most appropriate next step?", "options": [{"letter": "A", "text": "Proceed straight to colonoscopy to investigate the symptoms"}, {"letter": "B", "text": "Manage as functional (IBS-type) symptoms, given the calprotectin's strong negative predictive value"}, {"letter": "C", "text": "Start empirical treatment for IBD without further testing"}, {"letter": "D", "text": "Take no action now and simply repeat the calprotectin later"}], "correct": "B", "rationale": "A low FC has a strong negative predictive value; a low-risk patient can be managed as functional (IBS-type) symptoms without colonoscopy."}, {"num": 2, "question": "A patient's faecal calprotectin comes back at 55 µg/g, and repeat testing two weeks later shows 47 µg/g. How should this result be interpreted?", "options": [{"letter": "A", "text": "IBD is excluded by this result"}, {"letter": "B", "text": "IBD is confirmed by this result"}, {"letter": "C", "text": "The result is uncertain — repeat the test and consider additional clinical testing"}, {"letter": "D", "text": "The test is falsely elevated and should not be repeated"}], "correct": "C", "rationale": "40–49 µg/g is a grey zone — neither a reliable rule-in nor rule-out — favouring repeat testing and further clinical correlation."}, {"num": 3, "question": "A patient with suspected Crohn's disease has a faecal calprotectin of 264 µg/g. Ileocolonoscopy with biopsies is unremarkable, but symptoms persist. What is the most appropriate next step to complete the diagnostic workup?", "options": [{"letter": "A", "text": "Repeat the ileocolonoscopy immediately using the same protocol"}, {"letter": "B", "text": "Diagnose functional bowel disease, since the endoscopy was normal"}, {"letter": "C", "text": "Arrange cross-sectional imaging of the small bowel (MR or CT enterography)"}, {"letter": "D", "text": "Start empirical corticosteroids without any further imaging"}], "correct": "C", "rationale": "A raised calprotectin (264 µg/g) with a normal ileocolonoscopy warrants cross-sectional small bowel imaging to complete the workup."}, {"num": 4, "question": "A patient newly presenting with diarrhoea and biopsy-proven chronic colitis has positive ASCA and negative pANCA serology. How should this result be used in distinguishing Crohn's disease from ulcerative colitis?", "options": [{"letter": "A", "text": "It is diagnostic of Crohn's disease and confirms the phenotype"}, {"letter": "B", "text": "It should not be used to differentiate Crohn's disease from ulcerative colitis"}, {"letter": "C", "text": "It excludes ulcerative colitis with high specificity"}, {"letter": "D", "text": "It replaces the need for terminal ileum intubation"}], "correct": "B", "rationale": "ASCA/pANCA serology has low diagnostic accuracy and should not be used to differentiate CD from UC."}, {"num": 5, "question": "A 34-year-old man has persistent iron-deficiency anaemia with no overt GI bleeding, mild bloating and abdominal cramps, faecal calprotectin 515 µg/g and CRP 12 mg/L. Ileocolonoscopy and MR enterography are both normal. What is the most appropriate next step?", "options": [{"letter": "A", "text": "Patency capsule to assess for a retained stricture before proceeding to VCE"}, {"letter": "B", "text": "Video capsule endoscopy (VCE) directly, without any patency assessment"}, {"letter": "C", "text": "Repeat ileocolonoscopy, since capsule endoscopy has no additional role"}, {"letter": "D", "text": "Start empirical treatment for Crohn's disease without further investigation"}], "correct": "A", "rationale": "Given unexplained iron-deficiency anaemia and a raised FC with normal endoscopy/MRE, a patency capsule should assess stricture risk before VCE."}, {"num": 6, "question": "Colonoscopy in a patient with chronic bloody diarrhoea shows continuous, circumferential inflammation beginning at the rectum, with biopsies showing crypt architectural distortion and basal plasmacytosis. No granulomas or skip lesions are seen. Which diagnosis is favoured?", "options": [{"letter": "A", "text": "Crohn's disease"}, {"letter": "B", "text": "Ulcerative colitis"}, {"letter": "C", "text": "Intestinal tuberculosis"}, {"letter": "D", "text": "Ischaemic colitis"}], "correct": "B", "rationale": "Continuous rectal-starting inflammation with crypt distortion and basal plasmacytosis, and no granulomas or skip lesions, favours ulcerative colitis."}, {"num": 7, "question": "A patient has patchy, discontinuous colonic inflammation with deep linear ulcers and rectal sparing. Biopsies show non-caseating granulomas. How does the presence of granulomas influence the diagnosis of Crohn's disease?", "options": [{"letter": "A", "text": "Their absence would exclude Crohn's disease"}, {"letter": "B", "text": "They are not specific for Crohn's disease and are seen in only 50–60% of confirmed cases"}, {"letter": "C", "text": "They are exclusive findings in ulcerative colitis"}, {"letter": "D", "text": "Their presence here suggests intestinal TB rather than Crohn's disease"}], "correct": "B", "rationale": "Granulomas are not specific for Crohn's disease and are seen in only 50–60% of confirmed cases — their absence does not exclude the diagnosis."}, {"num": 8, "question": "A 71-year-old with vascular risk factors and no prior GI history develops a single episode of self-limited bloody diarrhoea. Colonoscopy shows patchy left-sided colitis with rectal sparing. What is the most appropriate next step?", "options": [{"letter": "A", "text": "Complete pre-biologic screening (TB, viral serology) before starting therapy"}, {"letter": "B", "text": "Actively exclude ischaemic, infectious, and drug-induced colitis before diagnosing IBD"}, {"letter": "C", "text": "Start mesalazine for presumed ulcerative colitis"}, {"letter": "D", "text": "Discharge with reassurance; no further workup is required"}], "correct": "B", "rationale": "Rectal sparing (the rectum's dual blood supply often protects it in ischaemic colitis) should prompt exclusion of ischaemic, infectious, and drug-induced mimics before an IBD diagnosis is made."}, {"num": 9, "question": "A patient has rectal-sparing colitis with segmental involvement, and biopsies show both crypt abscesses and chronic inflammatory change without a definitive fistula or granuloma. Comprehensive workup cannot clearly assign Crohn's disease or ulcerative colitis. What is the most appropriate label and next step?", "options": [{"letter": "A", "text": "IBD-unclassified — treat based on the predominant feature pattern"}, {"letter": "B", "text": "No diagnosis can be made, and treatment must be withheld indefinitely"}, {"letter": "C", "text": "This must be Crohn's disease, since transmural change is diagnostic"}, {"letter": "D", "text": "This must be ulcerative colitis, since rectal sparing is irrelevant"}], "correct": "A", "rationale": "IBD-unclassified does not mean untreated — classify by predominant features but don't withhold therapy for confirmed inflammation."}, {"num": 10, "question": "A patient has confirmed active inflammation on endoscopy, but the CD-versus-UC phenotype remains unclear despite full workup. What is the most appropriate management approach regarding treatment timing?", "options": [{"letter": "A", "text": "Delay all therapy until the phenotype is fully resolved, however long that takes"}, {"letter": "B", "text": "Treat the confirmed inflammation promptly regardless of the CD/UC uncertainty"}, {"letter": "C", "text": "Only monitor with biomarkers, since endoscopic activity does not warrant treatment"}, {"letter": "D", "text": "Refer for surgery as the default first-line management"}], "correct": "B", "rationale": "Diagnostic uncertainty between CD and UC should not, by itself, delay appropriate therapy once active inflammation is confirmed."}]}, "M2": {"title": "M2 · IBD Mimics — CD vs Intestinal TB", "questions": [{"num": 1, "question": "A 34-year-old man from a TB-endemic region undergoes colonoscopy for chronic right-sided abdominal pain. Six features are noted: (1) a patulous, gaping ileocaecal valve; (2) transverse, circumferential ulcers; (3) short-segment, contiguous ileocaecal involvement without skip lesions; (4) a nodular, scarred caecum; (5) scattered aphthous ulcers in the terminal ileum; (6) mild mucosal oedema throughout the exam. Which combination of four features is most specific for favouring intestinal TB over Crohn's disease?", "options": [{"letter": "A", "text": "Features 1, 2, 3, and 4"}, {"letter": "B", "text": "Features 2, 3, 5, and 6"}, {"letter": "C", "text": "Features 1, 4, 5, and 6"}, {"letter": "D", "text": "Features 1, 2, 5, and 6"}], "correct": "A", "rationale": "Patulous ileocaecal valve, transverse ulcers, short-segment contiguous disease without skip lesions, and a nodular scarred caecum are the classic ITB-favouring quartet; aphthous ileal ulcers and mild oedema are non-discriminatory and seen in both CD and ITB."}, {"num": 2, "question": "A separate patient with active ulcerative colitis is being planned for anti-TNF therapy. She has no respiratory symptoms and no known TB contact history. Which combination of investigations should be undertaken next to screen for latent TB before starting treatment?", "options": [{"letter": "A", "text": "IGRA (TB quantiferon) and chest X-ray"}, {"letter": "B", "text": "Sputum AFB smear and CT thorax"}, {"letter": "C", "text": "Sputum AFB smear and IGRA only"}, {"letter": "D", "text": "Chest X-ray and CT thorax"}], "correct": "A", "rationale": "Routine pre-biologic latent TB screening is IGRA plus chest X-ray; sputum AFB and CT thorax are reserved for patients with respiratory symptoms or an abnormal CXR, not routine screening before starting anti-TNF therapy."}, {"num": 3, "question": "CT enterography in a 28-year-old woman with suspected IBD shows a 1.4 cm mesenteric lymph node with central necrosis, alongside short-segment ileocaecal wall thickening. There is no comb sign, no fibrofatty proliferation, and no small-bowel skip lesions. What does this imaging pattern suggest?", "options": [{"letter": "A", "text": "This is classic for Crohn's disease and should prompt anti-TNF therapy"}, {"letter": "B", "text": "The necrotic node and short-segment, non-skip pattern favour intestinal TB over CD"}, {"letter": "C", "text": "Necrotic lymph nodes are a normal CT finding with no diagnostic significance"}, {"letter": "D", "text": "The comb sign is required to make any CD/ITB distinction here"}], "correct": "B", "rationale": "Necrotic lymph nodes plus short-segment, non-skip involvement favour ITB on CTE; necrotic nodes are pathognomonic but have low sensitivity, so a positive finding still carries diagnostic weight."}, {"num": 4, "question": "A patient with suspected intestinal TB versus Crohn's disease is started empirically on corticosteroids while investigations are pending. Her IGRA (TB quant) returns indeterminate on one occasion and negative on repeat testing. How should this result be interpreted?", "options": [{"letter": "A", "text": "A negative/indeterminate IGRA on steroids reliably excludes TB infection"}, {"letter": "B", "text": "IGRA sensitivity is reduced by immunosuppression, so this result does not exclude TB"}, {"letter": "C", "text": "An indeterminate result should be treated as equivalent to a positive result"}, {"letter": "D", "text": "IGRA testing should be abandoned once steroids have been started"}], "correct": "B", "rationale": "Corticosteroids and other immunosuppression reduce IGRA sensitivity, so a negative or indeterminate result in this context does not reliably exclude TB infection."}, {"num": 5, "question": "Two endoscopic biopsies from the right colon in a patient with a caseating granuloma and a necrotic lymph node are sent for TB culture; the result comes back negative. What is the most accurate interpretation?", "options": [{"letter": "A", "text": "A negative culture from 2 biopsies definitively excludes intestinal TB"}, {"letter": "B", "text": "A negative culture does not exclude ITB, given culture sensitivity of only ~20–60% from endoscopic biopsies"}, {"letter": "C", "text": "A negative culture means the patient should start anti-TNF therapy immediately"}, {"letter": "D", "text": "Culture sensitivity for intestinal TB always exceeds 90%, so this result is reliable"}], "correct": "B", "rationale": "Intestinal TB is paucibacillary; culture sensitivity from limited endoscopic sampling is often only ~20–60%, so a negative result does not meaningfully exclude ITB given other favouring features."}, {"num": 6, "question": "A clinician wants to use a validated composite scoring system (the He nomogram) to help discriminate CD from ITB in an equivocal case. Which set of variables does this model combine into a single score?", "options": [{"letter": "A", "text": "Clinical, endoscopic, imaging, and immunological variables (age, ulcer type, distribution, target/comb sign, IGRA)"}, {"letter": "B", "text": "Endoscopic variables alone, without any imaging or immunological input"}, {"letter": "C", "text": "Imaging variables alone, without any endoscopic or immunological input"}, {"letter": "D", "text": "IGRA/PPD result alone, without any endoscopic or imaging input"}], "correct": "A", "rationale": "The He nomogram combines clinical, endoscopic, imaging, and immunological variables (age, ulcer type, distribution, target/comb sign, IGRA) into one composite score — no single-domain variable is used alone."}, {"num": 7, "question": "A patient undergoes colonoscopy for chronic diarrhoea. Findings show continuous, circumferential inflammation extending proximally from the rectum with no intervening areas of normal mucosa. Which diagnosis does this distribution most favour, and why?", "options": [{"letter": "A", "text": "Ulcerative colitis — continuous, rectal-starting inflammation without skip areas is characteristic"}, {"letter": "B", "text": "Crohn's disease — continuous involvement from the rectum is typical of CD"}, {"letter": "C", "text": "Intestinal TB — rectal involvement is a hallmark of ITB"}, {"letter": "D", "text": "Either diagnosis is equally likely; distribution has no discriminatory value"}], "correct": "A", "rationale": "Continuous, circumferential inflammation beginning at the rectum without skip areas is the classic distribution pattern of ulcerative colitis."}, {"num": 8, "question": "Biopsies from a colitis workup show focally enhanced colitis (patchy, pericryptal inflammation) and submucosal non-caseating granulomas, with normal-appearing mucosa between inflamed segments on endoscopy. Which diagnosis do these histologic and endoscopic features together favour?", "options": [{"letter": "A", "text": "Crohn's disease — focally enhanced colitis, granulomas, and skip areas are characteristic"}, {"letter": "B", "text": "Ulcerative colitis — these features are typical of UC's mucosal-only involvement"}, {"letter": "C", "text": "Intestinal TB — granulomas here are diagnostic of ITB, not CD"}, {"letter": "D", "text": "Ischaemic colitis — patchy inflammation always indicates an ischaemic cause"}], "correct": "A", "rationale": "Focally enhanced (patchy, pericryptal) colitis, submucosal non-caseating granulomas, and skip areas (normal mucosa between inflamed segments) are characteristic of Crohn's disease — findings identifiable on standard mucosal/submucosal endoscopic biopsy."}, {"num": 9, "question": "A 68-year-old on long-term olmesartan for hypertension presents with chronic watery diarrhoea, weight loss, and villous atrophy on duodenal biopsy, with negative coeliac serology. Colonic biopsies show lymphocytic colitis. What is the most likely explanation, and what is the appropriate next step?", "options": [{"letter": "A", "text": "Olmesartan-associated sprue-like enteropathy — stop the drug and reassess"}, {"letter": "B", "text": "Coeliac disease with a false-negative serology — start a gluten-free diet"}, {"letter": "C", "text": "Newly diagnosed ulcerative colitis — start mesalazine"}, {"letter": "D", "text": "Crohn's disease with small bowel involvement — start a biologic"}], "correct": "A", "rationale": "Olmesartan is a recognised cause of sprue-like enteropathy with villous atrophy and colitis mimicking coeliac disease or IBD; withdrawing the drug is the key management step."}, {"num": 10, "question": "A patient with an initially unrecognised intestinal TB is mistakenly treated as Crohn's disease and started on anti-TNF therapy. What is the key danger this guiding principle is designed to prevent?", "options": [{"letter": "A", "text": "There is no meaningful danger; anti-TNF is safe regardless of diagnosis"}, {"letter": "B", "text": "Unrecognised immunosuppression of active TB risks disseminated TB and death"}, {"letter": "C", "text": "The only consequence is a delayed CD diagnosis, with no patient risk"}, {"letter": "D", "text": "Anti-TNF therapy will have no effect on TB either way"}], "correct": "B", "rationale": "Misdiagnosing ITB as CD and starting immunosuppression risks disseminated TB and death — the threshold for an empirical anti-TB trial should be lower than the threshold for empirical immunosuppression."}]}, "M3": {"title": "M3 · Pharmacology I: The Classics", "questions": [{"num": 1, "question": "A 29-year-old man is newly diagnosed with ulcerative colitis, with endoscopic inflammation extending to the proximal descending colon and a UCEIS score of 5. He has never been treated. What is the most appropriate first-line induction regimen?", "options": [{"letter": "A", "text": "Oral mesalamine alone at ≥2g/day"}, {"letter": "B", "text": "Rectal mesalamine enema alone at ≥1g/day"}, {"letter": "C", "text": "Combination oral mesalamine (≥2g/day) plus rectal mesalamine enema (≥1g/day)"}, {"letter": "D", "text": "Budesonide MMX 9mg/day alone"}], "correct": "C", "rationale": "For a UCEIS score of 5 extending to the proximal descending colon, combination oral (≥2g/day) plus rectal (≥1g/day) mesalamine is recommended over either alone; rectal mesalamine is preferred over rectal steroids. (Candidates should recognise this UCEIS score as moderate disease themselves.)"}, {"num": 2, "question": "A patient with UC had 6 bloody stools per day at diagnosis. After 4 weeks of standard-dose mesalamine (2.4g/day), this has improved to 3 stools per day with intermittent blood; she is afebrile with a normal CRP and heart rate, not meeting Truelove–Witts criteria for acute severe UC. What is the most appropriate next step within the 5-ASA/budesonide class before moving to immunosuppression?", "options": [{"letter": "A", "text": "Declare treatment failure and start an anti-TNF agent immediately"}, {"letter": "B", "text": "Escalate to high-dose mesalamine (4–4.8g/day) and/or add budesonide MMX, then reassess"}, {"letter": "C", "text": "Switch to a different mesalamine formulation (e.g. Pentasa to Asacol) at the same dose"}, {"letter": "D", "text": "Stop mesalamine and observe without any treatment"}], "correct": "B", "rationale": "Improving from 6 to 3 stools/day with a normal CRP/heart rate confirms this is not acute severe UC; dose-response evidence supports escalating within class (high-dose ~32.5% vs standard ~24.4% remission) before moving to immunosuppression."}, {"num": 3, "question": "A patient with mild–moderate left-sided UC has 4–5 bloody stools per day despite 4 weeks of appropriately-dosed oral plus rectal mesalamine. What is the most appropriate next step?", "options": [{"letter": "A", "text": "Switch from Pentasa to Lialda (an alternate mesalamine formulation) at the same dose"}, {"letter": "B", "text": "Add budesonide MMX 9mg/day to the existing mesalamine regimen"}, {"letter": "C", "text": "Start oral systemic corticosteroids immediately, bypassing budesonide"}, {"letter": "D", "text": "Proceed directly to biologic therapy"}], "correct": "B", "rationale": "Budesonide MMX is added on top of, not instead of, mesalamine when appropriately-dosed 5-ASA fails, especially in left-sided disease."}, {"num": 4, "question": "A patient with extensive UC (Montreal E3) and a UCEIS score of 6 has been treated with budesonide MMX plus mesalamine for 4 weeks, with ongoing bloody stools. Why was this regimen suboptimal from the outset?", "options": [{"letter": "A", "text": "Budesonide MMX's evidence is strongest in mild–moderate left-sided disease, not extensive severe disease"}, {"letter": "B", "text": "Budesonide MMX is contraindicated in all forms of UC"}, {"letter": "C", "text": "Budesonide MMX has no evidence base at all in ulcerative colitis"}, {"letter": "D", "text": "Mesalamine and budesonide should never be combined under any circumstances"}], "correct": "A", "rationale": "Budesonide MMX's strongest evidence is in mild-moderate left-sided disease; a UCEIS of 6 needed systemic corticosteroids, not budesonide, from the outset. (Candidates should recognise this UCEIS score as moderate-severe disease themselves.)"}, {"num": 5, "question": "A patient has completed 6 weeks of appropriately-dosed oral (4g/day) plus rectal (1g/day) mesalamine for moderately active UC, with no meaningful improvement in stool frequency or bleeding. How should this be classified?", "options": [{"letter": "A", "text": "Treatment failure requiring escalation beyond 5-ASA"}, {"letter": "B", "text": "An inadequate trial requiring a further 8 weeks before any conclusion can be drawn"}, {"letter": "C", "text": "A sign to switch to a different mesalamine formulation"}, {"letter": "D", "text": "A normal, expected response to 5-ASA therapy"}], "correct": "A", "rationale": "Failure is defined as lack of response after 4–8 weeks of appropriately dosed 5-ASA therapy — this case meets that threshold."}, {"num": 6, "question": "Over the past 12 months, a UC patient on maintenance mesalamine has had two flares requiring oral corticosteroids, each relapsing either during the steroid taper or within 3 months of stopping steroids, though the patient feels entirely well between courses. How should this pattern be interpreted?", "options": [{"letter": "A", "text": "As treatment success, since the patient is asymptomatic between courses"}, {"letter": "B", "text": "As treatment failure requiring escalation beyond mesalamine"}, {"letter": "C", "text": "As an indication to increase the mesalamine dose only"}, {"letter": "D", "text": "As a reason to switch mesalamine formulations"}], "correct": "B", "rationale": "Relapse during steroid taper or within 3 months of stopping, occurring twice within 12 months, meets the definition of steroid dependency — itself a treatment failure requiring escalation beyond mesalamine, regardless of interval wellbeing."}, {"num": 7, "question": "A patient admitted with acute severe ulcerative colitis (Truelove–Witts criteria met) is now on day 3 of IV corticosteroids, with 5–6 loose, bloody stools per day and a CRP of 52. Per the Oxford/Travis criteria, what does this pattern indicate?", "options": [{"letter": "A", "text": "Steroid-refractory disease meeting criteria for escalation to rescue therapy"}, {"letter": "B", "text": "An excellent response to IV steroids requiring no further action"}, {"letter": "C", "text": "A need to switch to oral steroids and continue monitoring at home"}, {"letter": "D", "text": "A contraindication to any further escalation of therapy"}], "correct": "A", "rationale": "Persisting 3–7 stools/day with CRP>45 by day 3 of IV steroids (Oxford/Travis criteria) meets the definition of steroid-refractory acute severe UC, warranting rescue therapy."}, {"num": 8, "question": "A 22-year-old is newly diagnosed with extensive UC (Montreal E3), deep ulceration on colonoscopy, CRP 45 mg/L, and albumin 28 g/L. After one course of oral corticosteroids achieves clinical response, what should be considered?", "options": [{"letter": "A", "text": "Continuing corticosteroids long-term as maintenance therapy"}, {"letter": "B", "text": "Early advanced therapy, given the poor prognostic factors present at diagnosis"}, {"letter": "C", "text": "Simply repeating oral corticosteroid courses as needed in future flares"}, {"letter": "D", "text": "No further action, since the patient responded to this course"}], "correct": "B", "rationale": "Poor prognostic factors at diagnosis — young age, extensive colitis, deep ulceration, high CRP, and low albumin — support considering early advanced therapy even after a single successful steroid course; this reflects an emerging top-down strategy in high-risk UC rather than a fixed guideline mandate, and should be individualised."}, {"num": 9, "question": "Three days after starting oral mesalamine for UC, a patient develops worsening crampy abdominal pain, bloody diarrhoea, new arthralgia, and a rash. What is the most likely explanation?", "options": [{"letter": "A", "text": "Mesalamine-induced acute intolerance syndrome (a hypersensitivity reaction)"}, {"letter": "B", "text": "An expected therapeutic response to mesalamine"}, {"letter": "C", "text": "Definite proof that the UC is now steroid-refractory"}, {"letter": "D", "text": "A dose-dependent toxic effect requiring dose reduction only"}], "correct": "A", "rationale": "Mesalamine-induced acute intolerance syndrome is a hypersensitivity reaction, not dose-dependent, and easily mistaken for a flare."}, {"num": 10, "question": "A patient on Pentasa (controlled-release mesalamine) 4g/day for 6 weeks shows no improvement in a moderately active flare. A colleague suggests switching to Asacol (delayed-release mesalamine) at the same dose. Is this an evidence-based next step?", "options": [{"letter": "A", "text": "Yes — different mesalamine formulations have meaningfully different efficacy"}, {"letter": "B", "text": "No — formulations are comparable in efficacy; escalate dose or class instead"}, {"letter": "C", "text": "Yes, but only if combined with a higher dose"}, {"letter": "D", "text": "No — mesalamine should be stopped entirely instead of switched"}], "correct": "B", "rationale": "No mesalamine formulation is superior to another; switching formulations on failure is not evidence-based — escalate dose or class instead."}]}, "M4": {"title": "M4 · Pharmacology II: Advanced Biologics", "questions": [{"num": 1, "question": "A 19-year-old man is newly diagnosed with ileocolonic Crohn's disease. Colonoscopy shows deep ulceration in the terminal ileum and active perianal fistulising disease. Which factor most strongly supports starting a biologic first-line rather than azathioprine monotherapy?", "options": [{"letter": "A", "text": "His age alone, regardless of disease severity"}, {"letter": "B", "text": "Deep ulceration and perianal fistulising disease are poor prognostic factors"}, {"letter": "C", "text": "Azathioprine is contraindicated in ileocolonic disease"}, {"letter": "D", "text": "Biologics are always preferred first-line over azathioprine"}], "correct": "B", "rationale": "Deep ulceration and perianal fistulising disease are classic poor-prognostic factors that favour early advanced (biologic) therapy over azathioprine monotherapy."}, {"num": 2, "question": "Before starting azathioprine in a patient of East Asian ethnicity, NUDT15 testing shows intermediate (heterozygous) enzyme activity. What is the most appropriate initial dosing approach?", "options": [{"letter": "A", "text": "Standard dose, 2–2.5 mg/kg/day, as for normal NUDT15 activity"}, {"letter": "B", "text": "Reduced dose, approximately 0.5–1.5 mg/kg/day, with close monitoring"}, {"letter": "C", "text": "Azathioprine is contraindicated — proceed directly to a biologic"}, {"letter": "D", "text": "Approximately 10% of standard dose with intensive monitoring"}], "correct": "B", "rationale": "NUDT15 is a more clinically relevant pharmacogenomic marker than TPMT in East Asian populations; intermediate/heterozygous activity carries a markedly higher leukopenia risk, so a reduced starting dose (~0.5–1.5 mg/kg/day) with close monitoring is appropriate."}, {"num": 3, "question": "A 65kg patient with normal TPMT and NUDT15 activity is on azathioprine 100mg/day for Crohn's disease, with ongoing symptoms. WBC is 7 ×10⁹/L, MCV is unchanged from baseline, transaminases are normal, and creatinine is at baseline. How should the azathioprine be managed?", "options": [{"letter": "A", "text": "Increase the dose towards the weight-appropriate target (2–2.5 mg/kg/day)"}, {"letter": "B", "text": "Maintain the current dose unchanged"}, {"letter": "C", "text": "Switch to 6-mercaptopurine at an equivalent dose"}, {"letter": "D", "text": "Stop azathioprine and switch to a biologic"}], "correct": "A", "rationale": "100mg/day in a 65kg patient (~1.5 mg/kg/day) is below the weight-based target of 2–2.5 mg/kg/day. With normal TPMT/NUDT15, no cytopenia, no hepatotoxicity, and stable renal function, the appropriate response to ongoing symptoms is to increase the dose towards target rather than switch drug or stop."}, {"num": 4, "question": "A patient with high-risk Crohn's disease (stricturing ileal disease with poor prognostic factors) is being started on advanced therapy. Cross-sectional imaging shows a 'hot' (inflammatory) stricture with mural hyperenhancement, no prestenotic dilatation, and no features of a fixed fibrotic segment. Which treatment approach is most appropriate?", "options": [{"letter": "A", "text": "Azathioprine monotherapy"}, {"letter": "B", "text": "Infliximab monotherapy"}, {"letter": "C", "text": "Infliximab plus azathioprine combination therapy"}, {"letter": "D", "text": "Sulfasalazine"}], "correct": "C", "rationale": "Imaging confirming a 'hot' (inflammatory, not fixed fibrotic) stricture supports treating the inflammatory component; high-risk Crohn's disease with poor prognostic factors is an indication for combination anti-TNF plus immunomodulator therapy. A fixed fibrotic stricture would instead warrant endoscopic dilatation or surgical referral rather than escalating immunosuppression; monotherapy undertreats the risk, and sulfasalazine has no meaningful role in Crohn's disease."}, {"num": 5, "question": "Which adalimumab trough level is most consistent with an adequate maintenance-phase target?", "options": [{"letter": "A", "text": "2 mcg/mL"}, {"letter": "B", "text": "4 mcg/mL"}, {"letter": "C", "text": "8 mcg/mL"}, {"letter": "D", "text": "Any detectable level is considered adequate"}], "correct": "C", "rationale": "Adalimumab maintenance-phase target trough is generally ≥7.5–10 mcg/mL; 8 mcg/mL is the only option consistent with an adequate maintenance level."}, {"num": 6, "question": "A patient on maintenance infliximab has ongoing clinical and endoscopic disease activity. TDM shows a therapeutic trough of 9 mcg/mL with no anti-drug antibodies detected. According to the 4-branch loss-of-response algorithm, what does this pattern indicate and what should be done?", "options": [{"letter": "A", "text": "Non-immune pharmacokinetic failure — dose escalate the same drug"}, {"letter": "B", "text": "Mechanistic failure — switch to a different drug class"}, {"letter": "C", "text": "Immune-mediated failure — add an immunomodulator and re-check in 8–12 weeks"}, {"letter": "D", "text": "Laboratory error — repeat the trough level before making any change"}], "correct": "B", "rationale": "Therapeutic trough + no antibodies + ongoing symptoms = mechanistic (non-response) failure — the drug's mechanism isn't controlling disease, so switch drug class rather than escalate dose."}, {"num": 7, "question": "A different patient on adalimumab, symptomatic and fully compliant with dosing, has a trough level of 3 mcg/mL with a negative anti-adalimumab antibody test. Which branch of the algorithm applies, and what is the recommended next step?", "options": [{"letter": "A", "text": "Mechanistic failure — switch drug class immediately"}, {"letter": "B", "text": "Immune-mediated failure — switch to a different anti-TNF"}, {"letter": "C", "text": "Non-immune pharmacokinetic failure — dose escalate ± add an immunomodulator, then reassess"}, {"letter": "D", "text": "No action needed — a trough of 3 mcg/mL is within the therapeutic range"}], "correct": "C", "rationale": "Low trough + negative antibodies in a symptomatic, compliant patient = non-immune pharmacokinetic failure — the drug is being cleared too fast for a non-immune reason; dose escalate ± add an immunomodulator and reassess."}, {"num": 8, "question": "A patient on infliximab monotherapy for Crohn's disease has improved clinically but still has active disease on repeat endoscopy/imaging. TDM shows a subtherapeutic infliximab trough with low-titre antibodies. What is the most appropriate next step?", "options": [{"letter": "A", "text": "Add an immunomodulator or dose-escalate within the anti-TNF class, then reassess"}, {"letter": "B", "text": "Continue infliximab unchanged and repeat imaging in 12 months"}, {"letter": "C", "text": "Switch immediately to a biologic outside the anti-TNF class"}, {"letter": "D", "text": "Stop all therapy and observe"}], "correct": "A", "rationale": "On infliximab monotherapy with a subtherapeutic trough and only low-titre antibodies, adding an immunomodulator or dose-escalating within the anti-TNF class is the appropriate next step before considering a switch out of class."}, {"num": 9, "question": "A patient on azathioprine 2 mg/kg/day (an appropriate weight-based dose) for 6 weeks has a routine CBC showing WBC 1.8 ×10⁹/L. What is the appropriate action?", "options": [{"letter": "A", "text": "Continue azathioprine unchanged and recheck CBC in 1 week"}, {"letter": "B", "text": "Reduce the dose by 25% while continuing therapy, then recheck in 2 weeks"}, {"letter": "C", "text": "Hold azathioprine until counts recover, then rechallenge at a reduced dose"}, {"letter": "D", "text": "No action needed — mild leukopenia is expected on thiopurines"}], "correct": "C", "rationale": "WBC <2.0 ×10⁹/L on an appropriately weight-dosed regimen warrants holding azathioprine until counts recover. A single episode of leukopenia is usually managed with a temporary hold and dose reduction on rechallenge with close monitoring, reserving permanent discontinuation for recurrent or severe cytopenia."}, {"num": 10, "question": "A treatment-naive patient starting infliximab is found to carry HLA-DQA1*05, a genetic marker associated with higher immunogenicity risk. Based on the combination-therapy evidence, what is the most appropriate approach?", "options": [{"letter": "A", "text": "Start infliximab monotherapy — immunomodulators add no benefit here"}, {"letter": "B", "text": "Start infliximab plus an immunomodulator combination therapy"}, {"letter": "C", "text": "Avoid infliximab altogether and select a non-anti-TNF agent"}, {"letter": "D", "text": "HLA-DQA1*05 status does not affect treatment choice"}], "correct": "B", "rationale": "HLA-DQA1*05 carriage is a recognised high-immunogenicity-risk marker — treatment-naive infliximab starters with this genotype are among the strongest evidence-based indications for combination therapy."}]}, "M5": {"title": "M5 · The STRIDE-II Framework", "questions": [{"num": 1, "question": "A patient with UC in clinical remission on mesalazine has stable faecal calprotectin over the past year. Per STRIDE-II, which biomarker cutoff most strongly predicts endoscopic remission at the intermediate-term monitoring point?", "options": [{"letter": "A", "text": "Faecal calprotectin <125 µg/g"}, {"letter": "B", "text": "CRP <15 mg/L"}, {"letter": "C", "text": "Faecal calprotectin <500 µg/g"}, {"letter": "D", "text": "CRP <30 mg/L"}], "correct": "A", "rationale": "FC <125 µg/g is the STRIDE-II intermediate-term biomarker cutoff that predicts endoscopic remission in UC."}, {"num": 2, "question": "A patient with Crohn's disease on combination azathioprine + infliximab reaches week 48 of the CALM-style monitoring protocol. Which combined biomarker profile best predicts mucosal healing (CDEIS<4, no deep ulcers)?", "options": [{"letter": "A", "text": "CRP <5 mg/L and faecal calprotectin <250 µg/g"}, {"letter": "B", "text": "CRP <30 mg/L alone, regardless of calprotectin"}, {"letter": "C", "text": "Faecal calprotectin >500 µg/g with normal CRP"}, {"letter": "D", "text": "Haemoglobin and albumin alone, without biomarkers"}], "correct": "A", "rationale": "CALM trial data: CRP<5 mg/L + FC<250 µg/g at week 48 was the best predictor of mucosal healing (CDEIS<4, no deep ulcers)."}, {"num": 3, "question": "In a patient established on maintenance advanced therapy for IBD, faecal calprotectin rises sharply but the patient reports only mild symptoms. What should happen before any escalation of immunosuppression?", "options": [{"letter": "A", "text": "Immediately double the biologic dose, since any calprotectin rise means a flare"}, {"letter": "B", "text": "Screen for superimposed infection (e.g. CMV, C. difficile) before attributing the rise to a flare"}, {"letter": "C", "text": "Wait 6 months and repeat calprotectin with no other action"}, {"letter": "D", "text": "Switch immediately to a different biologic class without any work-up"}], "correct": "B", "rationale": "A biomarker rise must trigger infection screening (especially CMV, C. difficile) before it is attributed to an IBD flare and treated with escalation."}, {"num": 4, "question": "A patient on immunosuppressive therapy for IBD is found to have deep, serpiginous colonic ulcers on endoscopy during a suspected flare. Which combination of tests is required to confirm the most important diagnosis to exclude?", "options": [{"letter": "A", "text": "Endoscopic appearance alone, without any tissue confirmation"}, {"letter": "B", "text": "Colonic tissue CMV PCR (quantitative) plus histopathology with immunohistochemistry"}, {"letter": "C", "text": "TB tissue culture and AFB smear on the same biopsy"}, {"letter": "D", "text": "Serum CRP trend over the following 4 weeks"}], "correct": "B", "rationale": "Colonic tissue CMV PCR plus histopathology/immunohistochemistry on biopsy is sufficient to confirm CMV colitis; blood CMV PCR is not required to make the diagnosis."}, {"num": 5, "question": "Colonic tissue CMV PCR returns 21,320 copies/mg tissue in a patient with active IBD and ongoing immunosuppression, confirming active CMV colitis. Blood CMV PCR (viraemia) is negative. What is the most appropriate management approach?", "options": [{"letter": "A", "text": "Treat the CMV and continue IBD therapy concurrently, since there is no viraemia"}, {"letter": "B", "text": "Withhold all IBD therapy indefinitely, regardless of viraemia status"}, {"letter": "C", "text": "Treat CMV first and delay all immunosuppression, since viraemia is presumed"}, {"letter": "D", "text": "Ignore the tissue result, since it is not clinically significant without viraemia"}], "correct": "A", "rationale": "A markedly elevated tissue CMV load (21,320 copies/mg) confirms active CMV colitis unambiguously. With tissue positivity but no viraemia, CMV and IBD are typically treated concurrently; if viraemia were present, CMV would be treated first before escalating immunosuppression."}, {"num": 6, "question": "A patient with active ulcerative colitis develops new axial spondyloarthritis. He was previously refractory to anti-TNF therapy for control of his UC symptoms. Which advanced therapy optimizes control of both the gut and the axial joint disease in a single agent?", "options": [{"letter": "A", "text": "Vedolizumab, because it is gut-selective and therefore safest"}, {"letter": "B", "text": "Upadacitinib, a JAK inhibitor with systemic activity effective for both UC and axial spondyloarthritis"}, {"letter": "C", "text": "Ustekinumab, since IL-12/23 blockade also treats axial disease well"}, {"letter": "D", "text": "Topical therapy for the gut plus NSAIDs for the joints, with no systemic change"}], "correct": "B", "rationale": "Anti-TNF is normally first-line for axial spondyloarthritis with IBD, but this patient has already failed anti-TNF for UC control, so it is not a reasonable option here. Upadacitinib (a JAK inhibitor) offers systemic activity effective for both UC and axial spondyloarthritis in a single agent, making it the appropriate next choice."}, {"num": 7, "question": "A patient with moderate-to-severe luminal Crohn's disease also has plaque psoriasis, which flares independently of gut disease activity. Which mechanism of action optimizes control of both conditions?", "options": [{"letter": "A", "text": "Selective IL-23 p19 inhibition (e.g. risankizumab), effective for both CD and psoriasis"}, {"letter": "B", "text": "Gut-selective α4β7 integrin blockade (vedolizumab), effective for both conditions"}, {"letter": "C", "text": "TNF inhibition alone, since anti-TNF never triggers psoriasis flares"}, {"letter": "D", "text": "IL-17 inhibition, since it is first-line for both CD and psoriasis"}], "correct": "A", "rationale": "Selective IL-23 p19 inhibitors (risankizumab, guselkumab) have strong evidence in both Crohn's disease and plaque psoriasis; IL-17 inhibitors and anti-TNF can each trigger or worsen psoriasiform reactions."}, {"num": 8, "question": "A patient with active luminal Crohn's disease also has moderate-to-severe atopic dermatitis (eczema) uncontrolled on topical therapy. Which advanced therapy class has evidence for treating both conditions?", "options": [{"letter": "A", "text": "JAK inhibitors (e.g. upadacitinib), which have evidence in both CD and atopic dermatitis"}, {"letter": "B", "text": "Vedolizumab, since gut-selective agents also treat atopic dermatitis well"}, {"letter": "C", "text": "Ustekinumab, since IL-12/23 blockade is first-line for atopic dermatitis"}, {"letter": "D", "text": "Anti-TNF therapy, since it has the strongest evidence for atopic dermatitis"}], "correct": "A", "rationale": "JAK inhibitors (e.g. upadacitinib) have separate regulatory evidence and approval in both Crohn's disease and moderate-to-severe atopic dermatitis, making them well-suited when both conditions coexist."}, {"num": 9, "question": "In the VARSITY trial, vedolizumab was compared head-to-head with adalimumab for induction and maintenance in moderate-to-severe UC. Which outcome does this trial support?", "options": [{"letter": "A", "text": "Vedolizumab achieved superior clinical remission at week 52 versus adalimumab"}, {"letter": "B", "text": "Adalimumab achieved superior clinical remission at week 52 versus vedolizumab"}, {"letter": "C", "text": "Vedolizumab achieved a faster clinical response than adalimumab by week 6"}, {"letter": "D", "text": "The two agents showed identical efficacy across all endpoints measured"}], "correct": "A", "rationale": "VARSITY showed vedolizumab was superior to adalimumab for clinical remission at week 52, though vedolizumab's onset of action is generally slower than adalimumab's in early induction."}, {"num": 10, "question": "A patient with Crohn's colitis on combination therapy is in sustained clinical and biochemical remission. Per the monitoring schedule, when should the first post-induction endoscopy be performed, and how often should surveillance continue if remission is sustained?", "options": [{"letter": "A", "text": "6–12 months post-induction, then every 12–24 months if sustained remission"}, {"letter": "B", "text": "Only if the patient becomes acutely unwell, never on a schedule"}, {"letter": "C", "text": "Every 4 weeks indefinitely, regardless of clinical status"}, {"letter": "D", "text": "Once at diagnosis only, with no further endoscopic follow-up"}], "correct": "A", "rationale": "Post-induction endoscopy at 6–12 months, then surveillance every 12–24 months if remission is sustained."}]}, "M6": {"title": "M6 · Safety & Monitoring", "questions": [{"num": 1, "question": "A 34-year-old is about to start infliximab for Crohn's disease. Which pre-immunosuppression screening combination is required before therapy begins?", "options": [{"letter": "A", "text": "CXR + IGRA for TB, plus viral serology (HBV, HCV, HIV, EBV, VZV, CMV)"}, {"letter": "B", "text": "Chest X-ray alone is sufficient; serology is not required"}, {"letter": "C", "text": "HIV test only, since other infections do not affect immunosuppression safety"}, {"letter": "D", "text": "No baseline screening is needed if the patient is asymptomatic"}], "correct": "A", "rationale": "Pre-immunosuppression screening requires TB assessment (CXR + IGRA) plus viral serology (HBV, HCV, HIV, EBV, VZV, CMV) before starting advanced therapy."}, {"num": 2, "question": "A patient due to start an anti-TNF agent has no documented varicella history and uncertain MMR immunity. Vaccination is felt to be needed before starting therapy. Which timing rule applies to live vaccines around immunosuppression?", "options": [{"letter": "A", "text": "Live vaccines can be given at any time, including on the same day as starting the biologic"}, {"letter": "B", "text": "Live vaccines should be given ≥4 weeks before immunosuppression starts"}, {"letter": "C", "text": "Live vaccines are always safe once any immunosuppressive therapy has started"}, {"letter": "D", "text": "Live vaccines should be given exactly 1 week before starting therapy"}], "correct": "B", "rationale": "Live vaccines must be given ≥4 weeks before starting immunosuppression, or deferred until ≥3 months after stopping it, to avoid vaccine-strain infection risk."}, {"num": 3, "question": "A patient established on azathioprine monotherapy is due for routine immunizations. Which of the following vaccines is CONTRAINDICATED while the patient remains on this immunosuppressive therapy?", "options": [{"letter": "A", "text": "Inactivated influenza vaccine"}, {"letter": "B", "text": "Recombinant (non-live) zoster vaccine"}, {"letter": "C", "text": "MMR (measles, mumps, rubella)"}, {"letter": "D", "text": "Pneumococcal conjug }], "correct": "B", "rationale": "BSG 2026 (East JE et al. Gut 2026;75:442-475): CRC surveillance begins at PSC diagnosis regardless of disease duration, performed annually with chromoendoscopy."}, {"num": 8, "question": "A patient with UC has a first-degree relative diagnosed with CRC at age 45, and colonoscopy shows dense pseudopolyposis in the sigmoid colon. There is no active inflammation and no dysplasia. Per the BSG 2026 CRC surveillance risk-stratification table, which surveillance interval applies?", "options": [{"letter": "A", "text": "Annual surveillance, because dense pseudopolyposis and FDR with CRC <50y are both annual-tier risk factors"}, {"letter": "B", "text": "Every 2-3 years, since there is no active inflammation"}, {"letter": "C", "text": "Every 5 years, since there is no dysplasia"}, {"letter": "D", "text": "No surveillance is needed until symptoms develop"}], "correct": "A", "rationale": "Dense pseudopolyposis and a first-degree relative with CRC <50y are both annual-tier risk factors per the BSG 2026 risk-stratification table."}, {"num": 9, "question": "A different UC patient has mild active inflammation on their most recent surveillance colonoscopy, no dysplasia, no PSC, and a first-degree relative diagnosed with CRC at age 61. Which surveillance interval is most appropriate per the BSG 2026 risk-stratification table?", "options": [{"letter": "A", "text": "Annual, because any family history of CRC automatically places the patient in the annual tier"}, {"letter": "B", "text": "Every 2-3 years — mild active inflammation and FDR with CRC ≥50y are both intermediate-risk (2-3 year) factors"}, {"letter": "C", "text": "Every 5 years, since the relative's CRC was diagnosed after age 50"}, {"letter": "D", "text": "Surveillance can be stopped altogether given the reassuring family history"}], "correct": "B", "rationale": "Mild active inflammation and an FDR with CRC ≥50y are intermediate-risk factors, placing the patient in the every 2-3 year surveillan
