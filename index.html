<script>
/* =========================================================================
   CONFIG — edit these before going live
   ========================================================================= */
const CONFIG = {
  // Google Apps Script Web App URL (see accompanying Code.gs + setup guide).
  // Leave blank to run in local/offline demo mode (progress stays in-memory only).
  GAS_URL: "https://script.google.com/macros/s/AKfycbzD0H1eZRclgahecmaNE81Rl4fo3zjbk_HfeuvTq0Pm_hesao4NRrw7qJO2W2_RsUyPpw/exec",
  PASS_MARK: 0.7, // 70% — unlimited retakes allowed
  DEFAULT_PLAYBACK_RATE: 1.5,
};

/* -------------------------------------------------------------------------
   HOW TO ATTACH REAL VIDEOS (do this once your MP4s are exported/uploaded)
   Edit the "module-data" JSON block below — find each module by "id" and
   set ONE of the following two fields (leave the other blank):

     "videoUrl": "https://storage.googleapis.com/your-bucket/m1.mp4?X-Goog-...."
        Self-hosted (e.g. a signed, time-limited Google Cloud Storage URL from
        a private bucket). Fully private — no third party involved. Takes
        priority over vimeoId if both are set.

     "vimeoId": "1234567890"
        A Vimeo video set to "Private" or "Unlisted", domain-restricted to
        this page's hosting domain if you want extra protection.

   Leaving both blank keeps the module in DEMO / SIMULATED mode so you can
   test all the gating/quiz/progress logic before real video is ready.
   ------------------------------------------------------------------------- */

/* =========================================================================
   DATA
   ========================================================================= */
const MODULES = JSON.parse(document.getElementById('module-data').textContent);
const QUIZBANK = JSON.parse(document.getElementById('quiz-data').textContent);

let PARTICIPANT = { name: '', email: '' };

// runtime state per stage id
let STATE = {}; // { [stageId]: {segDone:[bool], furthest:sec, videoComplete:bool, quiz:{score,passed,attempts,answers}} }
MODULES.forEach(m => {
  STATE[m.id] = {
    segDone: m.segments.map(()=>false),
    furthest: 0,
    videoComplete: false,
    promptAnswered: m.segments.map(()=>false),
    quiz: m.quizKey ? { score: null, passed: false, attempts: 0 } : null,
  };
});
STATE['feedback'] = { submitted: false };

let currentStage = 'opening'; // 'opening' | m1..m6 | 'closing' | 'feedback'
let currentSegIndex = 0;
let pendingPromptSeg = null;

/* =========================================================================
   GATE / BACKEND SYNC
   ========================================================================= */
function showGateError(msg){
  const el = document.getElementById('gate-error');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideGateError(){
  document.getElementById('gate-error').style.display = 'none';
}

async function startCourse(){
  const name = document.getElementById('gate-name').value.trim();
  const email = document.getElementById('gate-email').value.trim();
  hideGateError();
  if(!name || !email || !email.includes('@')){
    showGateError('Please enter your name and a valid email to continue.');
    return;
  }

  if(CONFIG.GAS_URL){
    const btn = document.getElementById('gate-btn');
    btn.disabled = true; btn.textContent = 'Checking…';
    try{
      const res = await fetch(`${CONFIG.GAS_URL}?action=checkAccess&email=${encodeURIComponent(email)}`);
      const data = await res.json();
      if(!data.allowed){
        showGateError("This email isn't on the registered participant list for this course. Double-check you're using the email you registered with, or contact the course organiser.");
        btn.disabled = false; btn.textContent = 'Start / Resume Course';
        return;
      }
    }catch(e){
      // Fail closed: if a roster is meant to be enforced we should not silently
      // let everyone in just because the access check couldn't be reached.
      showGateError("Couldn't verify your registration right now — check your connection and try again.");
      btn.disabled = false; btn.textContent = 'Start / Resume Course';
      return;
    }
    btn.disabled = false; btn.textContent = 'Start / Resume Course';
  }

  PARTICIPANT = { name, email };
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app-shell').style.display = 'flex';
  loadProgress().then(()=>{
    renderSidebar();
    renderStage(currentStage);
  });
}

async function loadProgress(){
  if(!CONFIG.GAS_URL) return; // offline demo mode
  try{
    const res = await fetch(`${CONFIG.GAS_URL}?action=getProgress&email=${encodeURIComponent(PARTICIPANT.email)}`);
    const data = await res.json();
    if(data && data.state){ STATE = Object.assign(STATE, data.state); }
  }catch(e){ console.warn('Could not load prior progress (offline demo mode?).', e); }
}

function logEvent(type, payload){
  if(!CONFIG.GAS_URL) return; // offline demo mode — no backend configured yet
  // Send the discrete event for the audit log, PLUS the full current STATE
  // snapshot so the backend can store one authoritative "latest progress"
  // record per participant (this is what loadProgress() reads back on resume).
  const body = new URLSearchParams({
    action: type,
    name: PARTICIPANT.name,
    email: PARTICIPANT.email,
    payload: JSON.stringify(payload || {}),
    fullState: JSON.stringify(STATE),
    ts: new Date().toISOString(),
  });
  fetch(CONFIG.GAS_URL, { method:'POST', mode:'no-cors', body }).catch(()=>{});
}

/* =========================================================================
   SIDEBAR — MASTER PROGRESS
   ========================================================================= */
function stageStatus(m){
  const st = STATE[m.id];
  if(m.quizKey){
    if(st.quiz.passed) return 'done';
    if(st.videoComplete && st.quiz.attempts>0) return 'retake';
    return isStageUnlocked(m.id) ? 'active' : 'locked';
  }
  if(m.id==='opening' || m.id==='closing'){
    if(st.videoComplete) return 'done';
    return isStageUnlocked(m.id) ? 'active' : 'locked';
  }
}

function isStageUnlocked(stageId){
  if(stageId==='opening') return true;
  const mod = MODULES.find(m=>m.id===stageId);
  if(mod && mod.quizKey){
    // Modules 1-6 all unlock together once the Opening video is complete —
    // participants can take them in any order they like.
    return STATE['opening'].videoComplete;
  }
  if(stageId==='closing'){
    // Closing only unlocks once every module quiz has been passed (>=70% each).
    return MODULES.filter(m=>m.quizKey).every(m=>STATE[m.id].quiz.passed);
  }
  if(stageId==='feedback'){
    return STATE['closing'].videoComplete;
  }
  return true;
}

function renderSidebar(){
  const el = document.getElementById('sidebar');
  let html = `<div class="mp-heading">Master Progress</div>`;

  // Opening
  html += sidebarItem('opening','Opening', stageStatus(MODULES.find(m=>m.id==='opening')));

  html += `<div class="mp-divider"></div>`;
  MODULES.filter(m=>m.quizKey).forEach(m=>{
    const st = STATE[m.id];
    const vidStatus = st.videoComplete ? 'done' : (isStageUnlocked(m.id)?'active':'locked');
    html += sidebarItem(m.id, m.title.replace(/^Module \d+: /,'Module '+m.id.replace('m','')+': '), vidStatus);
    // quiz sub-row
    let subCls='', subText='Quiz — locked until video is complete';
    if(st.quiz.passed){ subCls='pass'; subText = `Quiz — Passed (${Math.round(st.quiz.score*100)}%)`; }
    else if(st.quiz.attempts>0){ subCls='fail'; subText = `Quiz — ${Math.round(st.quiz.score*100)}% (attempt ${st.quiz.attempts}, ${Math.round(CONFIG.PASS_MARK*100)}% needed — try again)`; }
    else if(st.videoComplete){ subText='Quiz — ready to take'; }
    html += `<div class="mp-sub ${subCls}">↳ ${subText}</div>`;
  });

  html += `<div class="mp-divider"></div>`;
  const closingStatus = stageStatus(MODULES.find(m=>m.id==='closing'));
  html += sidebarItem('closing','Closing', closingStatus);
  if(closingStatus==='locked'){
    const passedCount = MODULES.filter(m=>m.quizKey).filter(m=>STATE[m.id].quiz.passed).length;
    html += `<div class="mp-sub">↳ Unlocks once all 6 module quizzes are passed (${passedCount}/6 so far)</div>`;
  }
  const fbStatus = STATE['feedback'].submitted ? 'done' : (isStageUnlocked('feedback')?'active':'locked');
  html += sidebarItem('feedback','Feedback & Completion', fbStatus, true);

  el.innerHTML = html;
}

function sidebarItem(id, label, status, compulsory){
  const iconCls = status==='done'?'done':status==='active'?'active-icon':status==='retake'?'retake':'locked-icon';
  const iconChar = status==='done'?'✓':status==='retake'?'!':status==='locked'?'🔒':'';
  const rowCls = ['mp-item', status==='locked'?'locked':'', currentStage===id?'active':''].join(' ');
  const clickable = status!=='locked';
  return `<div class="${rowCls}" ${clickable?`onclick="goToStage('${id}')"`:''}>
      <span class="mp-icon ${iconCls}">${iconChar}</span>${label}
      ${compulsory?'<div><span class="mp-compulsory-tag">COMPULSORY</span></div>':''}
    </div>`;
}

function goToStage(id){
  if(!isStageUnlocked(id) && !(STATE[id]&&STATE[id].videoComplete)) return;
  currentStage = id;
  currentSegIndex = 0;
  renderSidebar();
  renderStage(id);
}

/* =========================================================================
   STAGE RENDER ROUTER
   ========================================================================= */
function renderStage(id){
  const main = document.getElementById('stage-main');
  if(id === 'feedback'){ renderFeedback(main); return; }
  const mod = MODULES.find(m=>m.id===id);
  if(!mod){ main.innerHTML = '<p>Not found.</p>'; return; }

  // if video already complete and this module has a quiz, jump straight to quiz view by default
  const st = STATE[id];
  if(mod.quizKey && st.videoComplete){
    renderModulePage(main, mod, true);
  } else {
    renderModulePage(main, mod, false);
  }
}

function renderModulePage(main, mod, showQuiz){
  const st = STATE[mod.id];
  main.innerHTML = `
    <div class="stage-header">
      <h2>${mod.title}</h2>
      <p>${mod.subtitle}</p>
      <div class="tag-row">${mod.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
    </div>
    <div id="video-section"></div>
    <div id="quiz-section" style="margin-top:22px;"></div>
  `;
  renderVideoBlock(document.getElementById('video-section'), mod);
  if(mod.quizKey){
    if(showQuiz || st.videoComplete){
      renderQuizBlock(document.getElementById('quiz-section'), mod);
    }
  }
}

/* =========================================================================
   VIDEO PLAYER + SEGMENT GATING + IN-VIDEO PROMPTS
   ---------------------------------------------------------------------
   Two interchangeable "adapters" drive the exact same gating/segment/
   prompt logic below:
     - Vimeo adapter: used automatically once you set a module's vimeoId
       (see CONFIG / MODULES near the top). Private/domain-restricted
       Vimeo embeds work the same way.
     - Simulated adapter: used when a module has no vimeoId yet, so you
       (and this build's automated tests) can exercise the full
       segment-gating / in-video-prompt / progress flow without a real
       video attached.
   ========================================================================= */
let simTimer = null;
const VIMEO_PLAYERS = {}; // modId -> Vimeo.Player instance
const VIMEO_DURATIONS = {}; // modId -> real duration once known

function effDuration(mod){ return VIMEO_DURATIONS[mod.id] || mod.duration; }
function segAbs(mod, seg){
  // Real, confirmed timestamps (absolute seconds) take priority — used once
  // you've given exact mm:ss cut points for a module. endSec:null means
  // "runs to the end of the video" (real duration once known).
  if(seg.startSec !== undefined && seg.startSec !== null){
    const end = (seg.endSec !== undefined && seg.endSec !== null) ? seg.endSec : effDuration(mod);
    return { start: seg.startSec, end };
  }
  const d = effDuration(mod);
  return { start: seg.startFrac * d, end: seg.endFrac * d };
}

function renderVideoBlock(container, mod){
  const st = STATE[mod.id];
  // Priority: self-hosted video URL (e.g. a signed GCS link) > Vimeo > simulated demo player.
  const usesNative = !!mod.videoUrl;
  const usesVimeo = !usesNative && !!mod.vimeoId;
  container.innerHTML = `
    <div class="player-card">
      <div class="player-frame-wrap">
        ${usesNative ? `
          <video id="native-${mod.id}" src="${mod.videoUrl}" controls playsinline
            controlsList="nodownload noremoteplayback" disablePictureInPicture oncontextmenu="return false"
            style="width:100%;height:100%;position:absolute;inset:0;background:#000;"></video>
        ` : usesVimeo ? `
          <iframe id="vimeo-${mod.id}"
            src="https://player.vimeo.com/video/${mod.vimeoId}?title=0&byline=0&portrait=0&dnt=1&keyboard=0"
            style="width:100%;height:100%;border:0;position:absolute;inset:0;"
            allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
        ` : `
        <div class="sim-player" id="sim-${mod.id}">
          <div class="badge">DEMO / SIMULATED PLAYER — no video source configured yet</div>
          <h3>${mod.title}</h3>
          <p>Set this module's <code>videoUrl</code> (self-hosted, e.g. a signed GCS link) or <code>vimeoId</code>
             in the config to embed the real private video. This simulated player lets you test timestamp gating,
             segment locking and in-video prompts end-to-end before the real video is ready.</p>
          <div class="sim-controls">
            <button class="sim-btn" id="playbtn-${mod.id}" onclick="simTogglePlay('${mod.id}')">▶ Play</button>
            <button class="sim-btn" style="background:#3a4c5c" onclick="simRewind('${mod.id}')">⟲ Back to segment start</button>
          </div>
          <div class="sim-time" id="simtime-${mod.id}">00:00 / ${fmt(mod.duration)}</div>
        </div>
        `}
        <div class="prompt-overlay" id="overlay-${mod.id}"></div>
      </div>
      <div class="segbar" id="segbar-${mod.id}"></div>
      <div class="seglabels" id="seglabels-${mod.id}"></div>
    </div>
    <div class="stage-footer">
      <div style="display:flex;align-items:center;gap:14px;">
        <span class="video-progress-text" id="progresstext-${mod.id}"></span>
        ${(usesNative||usesVimeo) ? `<span style="font-size:12.5px;color:var(--grey-text);">Speed:
          <select id="speedsel-${mod.id}" onchange="playerSetRate('${mod.id}', this.value)" style="margin-left:4px;">
            ${[1,1.25,1.5,1.75,2].map(r=>`<option value="${r}" ${r===CONFIG.DEFAULT_PLAYBACK_RATE?'selected':''}>${r}×</option>`).join('')}
          </select></span>` : ''}
      </div>
      <div>
        ${mod.quizKey ?
          `<button class="btn" id="toquiz-${mod.id}" onclick="scrollToQuiz('${mod.id}')" ${st.videoComplete?'':'disabled'}>Continue to Quiz →</button>`
          : `<button class="btn" id="advance-${mod.id}" onclick="advanceAfterVideo('${mod.id}')" ${st.videoComplete?'':'disabled'}>Continue →</button>`
        }
      </div>
    </div>
    <div class="locked-note">Segments unlock in order as you watch — dragging ahead will snap back to where you last watched. Poll and case-check questions that appear mid-video must be answered before playback resumes. Downloading is disabled in the player controls.</div>
  `;
  drawSegBar(mod);
  updateProgressText(mod);
  if(usesNative) initNativePlayer(mod);
  else if(usesVimeo) initVimeoPlayer(mod);
}

/* ---- Native <video> adapter (self-hosted, e.g. signed GCS URL) ---- */
const NATIVE_PLAYERS = {}; // modId -> <video> element
function initNativePlayer(mod){
  const video = document.getElementById(`native-${mod.id}`);
  NATIVE_PLAYERS[mod.id] = video;
  const st = STATE[mod.id];

  video.playbackRate = CONFIG.DEFAULT_PLAYBACK_RATE;
  video.addEventListener('loadedmetadata', () => {
    VIMEO_DURATIONS[mod.id] = video.duration; // shared duration cache
    drawSegBar(mod);
    if(st.furthest > 0){ video.currentTime = st.furthest; }
    video.playbackRate = CONFIG.DEFAULT_PLAYBACK_RATE; // some browsers reset rate on src load
  });

  video.addEventListener('timeupdate', () => {
    if(pendingPromptSeg) return;
    onTimeAdvance(mod, video.currentTime);
  });

  video.addEventListener('seeked', () => {
    const cap = segAbs(mod, mod.segments[furthestReachableIndex(st)]).end;
    if(video.currentTime > cap + 0.75){ video.currentTime = cap; }
  });

  video.addEventListener('ended', () => onVideoEnded(mod));
}

/* ---- Vimeo adapter ---- */
function initVimeoPlayer(mod){
  if(typeof Vimeo === 'undefined'){ console.warn('Vimeo Player SDK not loaded.'); return; }
  const iframe = document.getElementById(`vimeo-${mod.id}`);
  const player = new Vimeo.Player(iframe);
  VIMEO_PLAYERS[mod.id] = player;
  const st = STATE[mod.id];

  player.getDuration().then(d => { VIMEO_DURATIONS[mod.id] = d; drawSegBar(mod); });
  player.setPlaybackRate(CONFIG.DEFAULT_PLAYBACK_RATE).catch(()=>{});

  // Resume where they left off (bounded by what they're allowed to have reached).
  if(st.furthest > 0){ player.setCurrentTime(st.furthest).catch(()=>{}); }

  player.on('timeupdate', data => {
    if(pendingPromptSeg) return; // frozen on a prompt
    onTimeAdvance(mod, data.seconds);
  });

  player.on('seeked', data => {
    const cap = segAbs(mod, mod.segments[furthestReachableIndex(st)]).end;
    if(data.seconds > cap + 0.75){
      player.setCurrentTime(cap).catch(()=>{});
    }
  });

  player.on('ended', () => onVideoEnded(mod));
}

function playerPlay(modId){
  if(NATIVE_PLAYERS[modId]) NATIVE_PLAYERS[modId].play().catch(()=>{});
  else if(VIMEO_PLAYERS[modId]) VIMEO_PLAYERS[modId].play().catch(()=>{});
  else simTogglePlay(modId, true);
}
function playerPause(modId){
  if(NATIVE_PLAYERS[modId]) NATIVE_PLAYERS[modId].pause();
  else if(VIMEO_PLAYERS[modId]) VIMEO_PLAYERS[modId].pause().catch(()=>{});
  else pausePlayer(modId);
}
function playerSeekTo(modId, t){
  if(NATIVE_PLAYERS[modId]) NATIVE_PLAYERS[modId].currentTime = t;
  else if(VIMEO_PLAYERS[modId]) VIMEO_PLAYERS[modId].setCurrentTime(t).catch(()=>{});
  else simSeekTo(modId, t);
}
function playerSetRate(modId, rate){
  rate = parseFloat(rate);
  if(NATIVE_PLAYERS[modId]) NATIVE_PLAYERS[modId].playbackRate = rate;
  else if(VIMEO_PLAYERS[modId]) VIMEO_PLAYERS[modId].setPlaybackRate(rate).catch(()=>{});
}

function drawSegBar(mod){
  const st = STATE[mod.id];
  const bar = document.getElementById(`segbar-${mod.id}`);
  const lbls = document.getElementById(`seglabels-${mod.id}`);
  if(!bar) return;
  bar.innerHTML = mod.segments.map((seg,i)=>{
    return `<div class="seg ${st.segDone[i]?'done':(i<=furthestReachableIndex(st)?'active':'locked')}" onclick="segClick('${mod.id}',${i})"></div>`;
  }).join('');
  lbls.innerHTML = mod.segments.map((seg,i)=>`<div class="lbl ${i===currentSegIndexFor(mod,st)?'current':''}">${seg.label}</div>`).join('');
}
function furthestReachableIndex(st){
  for(let i=0;i<st.segDone.length;i++){ if(!st.segDone[i]) return i; }
  return st.segDone.length-1;
}
function currentSegForTime(mod, t){
  for(let i=0;i<mod.segments.length;i++){ if(t < segAbs(mod, mod.segments[i]).end) return i; }
  return mod.segments.length-1;
}
function currentSegIndexFor(mod, st){ return currentSegForTime(mod, st.furthest); }

function segClick(modId, i){
  const mod = MODULES.find(m=>m.id===modId); const st = STATE[modId];
  if(i > furthestReachableIndex(st)) return; // locked
  playerSeekTo(modId, segAbs(mod, mod.segments[i]).start + 1);
}

function updateProgressText(mod){
  const st = STATE[mod.id];
  const el = document.getElementById(`progresstext-${mod.id}`);
  if(!el) return;
  const done = st.segDone.filter(Boolean).length;
  el.textContent = st.videoComplete ? 'Video complete ✓' : `${done}/${mod.segments.length} segments completed`;
}

/* ---- Shared time-advance logic (drives both adapters identically) ---- */
function onTimeAdvance(mod, t){
  const st = STATE[mod.id];
  // Defensive guard: never trust a reported time beyond what's currently
  // reachable, and reject non-finite/negative values outright. This closes
  // a loophole where a misconfigured/blocked embed (e.g. a Vimeo iframe
  // showing its "sign in to watch" wall) can still fire a timeupdate event
  // with a bogus/garbage timestamp and falsely mark the video "watched".
  if(!Number.isFinite(t) || t < 0) return;
  const cap = segAbs(mod, mod.segments[furthestReachableIndex(st)]).end + 2;
  if(t > cap) t = cap;
  st.furthest = Math.max(st.furthest, t);
  renderSimTime(mod);

  // Walk segments in order and stop at the first one not yet reached — and,
  // critically, stop immediately after triggering an unanswered prompt.
  // (Previously this used forEach with no break: if a single timeupdate
  // jump spanned multiple segment boundaries — e.g. under a coarse Vimeo
  // timeupdate interval, or a faster-than-1x playback rate — every prompt
  // in that span would fire and immediately get overwritten by the next,
  // so only the LAST one was ever actually visible/answerable, silently
  // skipping the others. The defensive cap above already prevents most of
  // this, but this loop makes the one-at-a-time guarantee explicit too.)
  for(let i=0;i<mod.segments.length;i++){
    const seg = mod.segments[i];
    if(st.segDone[i]) continue;
    const abs = segAbs(mod, seg);
    if(st.furthest < abs.end - 0.15) break;
    st.segDone[i] = true;
    logEvent('segmentComplete', {module:mod.id, segment:seg.label});
    drawSegBar(mod);
    updateProgressText(mod);
    if(seg.prompt && !st.promptAnswered[i]){
      playerPause(mod.id);
      // Snap the actual player back to this segment's exact boundary so
      // resumed playback picks up exactly here. Without this, if the real
      // player had already buffered/drifted past this point by the time we
      // paused, resuming would silently skip the video content between
      // this prompt and the next one.
      playerSeekTo(mod.id, abs.end);
      showPrompt(mod, i);
      break;
    }
  }

  if(st.furthest >= effDuration(mod) - 0.2){
    onVideoEnded(mod);
  }
}
function onVideoEnded(mod){
  const st = STATE[mod.id];
  if(st.videoComplete) return;
  playerPause(mod.id);
  st.furthest = effDuration(mod);
  st.segDone = st.segDone.map(()=>true);
  st.videoComplete = true;
  logEvent('videoComplete', {module:mod.id});
  renderSidebar();
  updateProgressText(mod);
  drawSegBar(mod);
  const advBtn = document.getElementById(`advance-${mod.id}`); if(advBtn) advBtn.disabled = false;
  const quizBtn = document.getElementById(`toquiz-${mod.id}`); if(quizBtn) quizBtn.disabled = false;
  if(mod.quizKey && !document.getElementById('quiz-section').innerHTML){
    renderQuizBlock(document.getElementById('quiz-section'), mod);
  }
}

/* ---- Simulated player engine (offline fallback + test harness) ---- */
function simTogglePlay(modId, forcePlay){
  const btn = document.getElementById(`playbtn-${modId}`);
  if(!forcePlay && simTimer && simTimer.modId===modId){ clearInterval(simTimer.h); simTimer=null; if(btn) btn.textContent='▶ Play'; return; }
  if(simTimer){ clearInterval(simTimer.h); }
  if(btn) btn.textContent = '⏸ Pause';
  const h = setInterval(()=>simTick(modId), 300);
  simTimer = {modId, h};
}
function simRewind(modId){
  const mod = MODULES.find(m=>m.id===modId); const st = STATE[modId];
  const segIdx = currentSegIndexFor(mod, st);
  simSeekTo(modId, segAbs(mod, mod.segments[segIdx]).start);
}
function simSeekTo(modId, t){
  const mod = MODULES.find(m=>m.id===modId); const st = STATE[modId];
  const cap = segAbs(mod, mod.segments[furthestReachableIndex(st)]).end;
  st._simTime = Math.min(t, cap); // cannot seek beyond furthest unlocked segment end
  renderSimTime(mod);
  drawSegBar(mod);
}
function renderSimTime(mod){
  const st = STATE[mod.id];
  const el = document.getElementById(`simtime-${mod.id}`);
  if(el) el.textContent = `${fmt(mod.vimeoId ? st.furthest : (st._simTime||0))} / ${fmt(effDuration(mod))}`;
}
function simTick(modId){
  const mod = MODULES.find(m=>m.id===modId); const st = STATE[modId];
  if(pendingPromptSeg) return; // paused on a prompt
  st._simTime = (st._simTime||0) + 0.3;
  onTimeAdvance(mod, st._simTime);
  if(st.videoComplete){ pausePlayer(modId); st._simTime = effDuration(mod); }
}
function pausePlayer(modId){
  if(simTimer && simTimer.modId===modId){ clearInterval(simTimer.h); simTimer=null; }
  const btn = document.getElementById(`playbtn-${modId}`); if(btn) btn.textContent='▶ Play';
}
function fmt(s){ s=Math.round(s); const m=Math.floor(s/60), sec=s%60; return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`; }

/* ---- In-video prompt overlay (docked inside the player window) ---- */
function showPrompt(mod, segIndex){
  pendingPromptSeg = {modId:mod.id, segIndex};
  const seg = mod.segments[segIndex];
  const p = seg.prompt;
  const overlay = document.getElementById(`overlay-${mod.id}`);
  const isMulti = p.kind==='poll' && p.multi;
  overlay.innerHTML = `
    <div class="prompt-card">
      <span class="prompt-kind ${p.kind}">${p.kind==='poll' ? 'QUICK POLL — not graded' : 'CASE CHECK'}</span>
      <h4>${p.question}</h4>
      <div id="promptopts-${mod.id}">
        ${p.options.map((opt,i)=>`
          <div class="prompt-opt" data-i="${i}" onclick="selectPromptOpt('${mod.id}',${i},${isMulti})">
            <input type="${isMulti?'checkbox':'radio'}" name="promptopt-${mod.id}" style="pointer-events:none;">
            <span>${opt}</span>
          </div>`).join('')}
      </div>
      <div id="promptrationale-${mod.id}"></div>
      <div class="prompt-actions">
        <button class="btn" id="promptsubmit-${mod.id}" disabled onclick="submitPrompt('${mod.id}',${segIndex})">Submit</button>
      </div>
    </div>`;
  overlay.classList.add('show');
}
let promptSelection = new Set();
function selectPromptOpt(modId, i, isMulti){
  const opts = document.querySelectorAll(`#promptopts-${modId} .prompt-opt`);
  if(isMulti){
    const el = [...opts].find(o=>+o.dataset.i===i);
    el.classList.toggle('selected');
  } else {
    opts.forEach(o=>o.classList.remove('selected'));
    [...opts].find(o=>+o.dataset.i===i).classList.add('selected');
  }
  document.getElementById(`promptsubmit-${modId}`).disabled = false;
}
function submitPrompt(modId, segIndex){
  const mod = MODULES.find(m=>m.id===modId); const st = STATE[modId];
  const seg = mod.segments[segIndex]; const p = seg.prompt;
  const opts = document.querySelectorAll(`#promptopts-${modId} .prompt-opt`);
  const selectedIdx = [...opts].filter(o=>o.classList.contains('selected')).map(o=>+o.dataset.i);
  st.promptAnswered[segIndex] = true;

  if(p.kind==='check'){
    opts.forEach(o=>{
      const i=+o.dataset.i;
      if(i===p.correct) o.classList.add('correct');
      else if(selectedIdx.includes(i)) o.classList.add('incorrect');
    });
    document.getElementById(`promptrationale-${modId}`).innerHTML =
      `<div class="rationale-box"><b>${selectedIdx.includes(p.correct)?'Correct.':'Not quite.'}</b> ${p.rationale}</div>`;
    document.getElementById(`promptsubmit-${modId}`).style.display='none';
    setTimeout(()=>closePromptAndResume(modId, segIndex), 1800);
  } else {
    const pollKey = `${modId}__seg${segIndex}`;
    logEvent('pollAnswer', {module:modId, pollKey, question:p.question, options:p.options, answer:selectedIdx});
    showPollResults(modId, segIndex, pollKey, selectedIdx);
  }
}

/* After submitting a poll (non-graded), show how everyone else has answered
   so far — pulled from the shared backend — before resuming playback. */
async function showPollResults(modId, segIndex, pollKey, selectedIdx){
  const mod = MODULES.find(m=>m.id===modId);
  const seg = mod.segments[segIndex]; const p = seg.prompt;
  let counts = p.options.map(()=>0), total = 0, live = false;
  if(CONFIG.GAS_URL){
    try{
      const res = await fetch(`${CONFIG.GAS_URL}?action=pollResults&key=${encodeURIComponent(pollKey)}`);
      const data = await res.json();
      if(data && data.ok){
        total = data.total || 0;
        (data.counts || []).forEach((c,i)=>{ counts[i] = c; });
        live = true;
      }
    }catch(e){ /* fall through to the own-answer-only view below */ }
  }
  if(total===0){
    // Offline demo mode, or no backend response yet — show just this
    // participant's own pick rather than an empty/misleading bar.
    selectedIdx.forEach(i=>{ counts[i] = (counts[i]||0) + 1; });
    total = 1;
  }
  const overlay = document.getElementById(`overlay-${modId}`);
  const card = overlay.querySelector('.prompt-card');
  card.innerHTML = `
    <span class="prompt-kind poll">QUICK POLL — results so far</span>
    <h4>${p.question}</h4>
    <div>
      ${p.options.map((opt,i)=>{
        const c = counts[i]||0;
        const pct = total ? Math.round(c/total*100) : 0;
        const mine = selectedIdx.includes(i);
        return `<div style="margin-bottom:10px;">
          <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px;gap:8px;">
            <span>${opt}${mine?' <b style="color:var(--blue);">(your answer)</b>':''}</span><span style="white-space:nowrap;">${pct}% (${c})</span>
          </div>
          <div style="background:#eef2f6;border-radius:5px;height:9px;overflow:hidden;">
            <div style="background:${mine?'var(--blue)':'#9db3c6'};height:100%;width:${pct}%;"></div>
          </div>
        </div>`;
      }).join('')}
    </div>
    <div style="font-size:11.5px;color:var(--grey-text);margin-top:4px;">
      ${total} response${total===1?'':'s'} so far${live?'':' (offline demo — live pooled results appear once connected to the backend)'}
    </div>
    <div class="prompt-actions">
      <button class="btn" id="promptsubmit-${modId}" onclick="closePromptAndResume('${modId}',${segIndex})">Continue</button>
    </div>`;
}

function closePromptAndResume(modId, segIndex){
  document.getElementById(`overlay-${modId}`).classList.remove('show');
  pendingPromptSeg = null;
  playerPlay(modId); // auto-resume
}

function scrollToQuiz(modId){
  const mod = MODULES.find(m=>m.id===modId);
  const qs = document.getElementById('quiz-section');
  if(!qs.innerHTML) renderQuizBlock(qs, mod);
  qs.scrollIntoView({behavior:'smooth'});
}
function advanceAfterVideo(modId){
  const order = ['opening', ...MODULES.filter(m=>m.quizKey).map(m=>m.id), 'closing', 'feedback'];
  const idx = order.indexOf(modId);
  goToStage(order[idx+1]);
}

/* =========================================================================
   QUIZ ENGINE
   ========================================================================= */
function renderQuizBlock(container, mod){
  const key = mod.quizKey;
  const bank = QUIZBANK[key];
  const st = STATE[mod.id];
  container.innerHTML = `
    <div class="quiz-card">
      <h3 style="margin-top:0;color:var(--navy);">${bank.title} — End-of-Module Quiz</h3>
      <div class="quiz-meta">${bank.questions.length} questions · Pass mark: ${Math.round(CONFIG.PASS_MARK*100)}% (${Math.ceil(bank.questions.length*CONFIG.PASS_MARK)}/${bank.questions.length})</div>
      <form id="quizform-${mod.id}">
        ${bank.questions.map((q,qi)=>`
          <div class="qblock">
            <h5>${q.num}. ${q.question}</h5>
            ${q.options.map(o=>`
              <label class="qopt"><input type="radio" name="q${qi}" value="${o.letter}"> <span><b>${o.letter}.</b> ${o.text}</span></label>
            `).join('')}
          </div>
        `).join('')}
      </form>
      <button class="btn" onclick="submitQuiz('${mod.id}')">Submit Quiz</button>
      <div id="quizresult-${mod.id}"></div>
    </div>
  `;
}
function submitQuiz(modId){
  const mod = MODULES.find(m=>m.id===modId);
  const bank = QUIZBANK[mod.quizKey];
  const form = document.getElementById(`quizform-${modId}`);
  let correct = 0;
  const answers = [];
  const perQuestion = [];
  bank.questions.forEach((q,qi)=>{
    const sel = form.querySelector(`input[name="q${qi}"]:checked`);
    const val = sel ? sel.value : null;
    answers.push(val);
    const isCorrect = val === q.correct;
    if(isCorrect) correct++;
    perQuestion.push({num:q.num, given:val, correct:q.correct, isCorrect});
  });
  if(answers.includes(null)){
    alert('Please answer every question before submitting.');
    return;
  }
  const score = correct / bank.questions.length;
  const passed = score >= CONFIG.PASS_MARK;
  const st = STATE[modId];
  st.quiz.score = score; st.quiz.passed = passed; st.quiz.attempts += 1; st.quiz.answers = answers;
  st.quiz.perQuestion = perQuestion; // latest attempt — used by the facilitator dashboard
  if(!st.quiz.firstAttemptPerQuestion) st.quiz.firstAttemptPerQuestion = perQuestion; // true difficulty signal, unaffected by retakes
  logEvent('quizSubmit', {module:modId, score, passed, attempts:st.quiz.attempts, perQuestion});

  const wrong = perQuestion.filter(p=>!p.isCorrect);
  const resEl = document.getElementById(`quizresult-${modId}`);
  resEl.innerHTML = `<div class="quiz-result ${passed?'pass':'fail'}">
      <b>${passed?'Passed':'Not yet — unlimited retakes, try again'}:</b> ${correct}/${bank.questions.length} (${Math.round(score*100)}%). ${passed?'This module is now complete.':'You need at least '+Math.round(CONFIG.PASS_MARK*100)+'% to unlock the next module. Review the correct answers below, then retake the quiz.'}
    </div>
    ${wrong.length ? `
      <div class="quiz-review">
        <h5 style="margin:16px 0 8px;font-size:13.5px;color:var(--navy);">Review — questions you missed</h5>
        ${wrong.map(w=>{
          const q = bank.questions.find(q=>q.num===w.num);
          const correctOpt = q.options.find(o=>o.letter===q.correct);
          const givenOpt = q.options.find(o=>o.letter===w.given);
          return `<div class="rationale-box" style="margin-bottom:8px;">
            <b>Q${q.num}.</b> ${q.question}<br>
            <span style="color:var(--red);">Your answer: ${w.given ? `${w.given}. ${givenOpt?givenOpt.text:''}` : '(none)'}</span><br>
            <span style="color:var(--green);">Correct answer: ${q.correct}. ${correctOpt?correctOpt.text:''}</span>
            ${q.rationale ? `<br><span style="color:#3d4a56;">${q.rationale}</span>` : ''}
          </div>`;
        }).join('')}
      </div>` : ''}
    ${!passed ? `<button class="btn" style="margin-top:10px;" onclick="renderQuizBlock(document.getElementById('quiz-section'), MODULES.find(m=>m.id==='${modId}'))">Retake Quiz</button>` : ''}
  `;
  renderSidebar();
}

/* =========================================================================
   FEEDBACK (COMPULSORY)
   ========================================================================= */
const FB_QUESTIONS = [
  {id:'relevance', text:'The content was relevant to my clinical practice.'},
  {id:'clarity', text:'The cases and explanations were clear and easy to follow.'},
  {id:'confidence', text:'This course improved my confidence in managing IBD.'},
  {id:'workshop_ready', text:'I feel prepared for the live workshop discussion.'},
];
let fbAnswers = {};
function renderFeedback(main){
  const st = STATE['feedback'];
  if(st.submitted){
    main.innerHTML = `
      <div class="completion-banner">
        <h2>🎉 Course Complete</h2>
        <p>Thank you, ${PARTICIPANT.name || 'participant'} — your feedback has been recorded and your completion is logged for the live workshop.</p>
      </div>`;
    return;
  }
  const allModsDone = MODULES.filter(m=>m.quizKey).every(m=>STATE[m.id].quiz.passed);
  const openingDone = STATE['opening'].videoComplete;
  const closingDone = STATE['closing'].videoComplete;
  if(!(allModsDone && openingDone && closingDone)){
    main.innerHTML = `<div class="stage-header"><h2>Feedback & Completion</h2></div>
      <div class="locked-note">Complete the Opening, all 6 modules (≥${Math.round(CONFIG.PASS_MARK*100)}% quiz each) and the Closing video to unlock the compulsory feedback form.</div>`;
    return;
  }
  main.innerHTML = `
    <div class="stage-header">
      <h2>Feedback & Completion <span class="mp-compulsory-tag">COMPULSORY</span></h2>
      <p>This short form is required to complete the course and confirm your readiness for the live workshop.</p>
    </div>
    <div class="quiz-card">
      ${FB_QUESTIONS.map(q=>`
        <div class="fb-q">
          <label>${q.text}</label>
          <div class="likert" id="likert-${q.id}">
            ${[1,2,3,4,5].map(v=>`<span onclick="setLikert('${q.id}',${v})" id="likert-${q.id}-${v}">${v}</span>`).join('')}
          </div>
        </div>
      `).join('')}
      <div class="fb-q">
        <label>What could be improved before the live workshop?</label>
        <textarea id="fb-open"></textarea>
      </div>
      <button class="btn" onclick="submitFeedback()">Submit Feedback & Complete Course</button>
    </div>
  `;
}
function setLikert(qid, val){
  fbAnswers[qid] = val;
  [1,2,3,4,5].forEach(v=>document.getElementById(`likert-${qid}-${v}`).classList.toggle('selected', v===val));
}
function submitFeedback(){
  if(FB_QUESTIONS.some(q=>!fbAnswers[q.id])){
    alert('Please rate every statement before submitting.');
    return;
  }
  const openText = document.getElementById('fb-open').value;
  STATE['feedback'].submitted = true;
  logEvent('feedbackSubmit', {ratings:fbAnswers, comment:openText});
  logEvent('courseComplete', {});
  renderSidebar();
  renderStage('feedback');
}
